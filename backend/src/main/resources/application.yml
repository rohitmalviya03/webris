spring:
  application:
    name: ris-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3333/risdb?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Kolkata}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: RisHikariPool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 25

  jackson:
    time-zone: Asia/Kolkata
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

server:
  port: 8080
  servlet:
    context-path: /api

spring.jpa.properties.hibernate.jdbc.time_zone: Asia/Kolkata

# SECURITY: JWT_SECRET must be set as an environment variable in production.
# Minimum 32 characters. The fallback below is for local development ONLY.
jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-in-prod!!}
  expiration: ${JWT_EXPIRATION:86400000}

# CORS: Set CORS_ALLOWED_ORIGINS to comma-separated list of allowed frontend origins.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5174}

orthanc:
  url: ${ORTHANC_URL:http://localhost:8042}
  username: ${ORTHANC_USERNAME:admin}
  password: ${ORTHANC_PASSWORD:admin}

app:
  upload-dir: uploads

# Login security settings
login:
  max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
  lock-duration-minutes: ${LOGIN_LOCK_DURATION_MINUTES:30}
  rate-limit:
    ip-capacity: ${LOGIN_RATE_LIMIT_CAPACITY:10}
    ip-refill-minutes: ${LOGIN_RATE_LIMIT_REFILL_MINUTES:1}

# Actuator: only expose health and info publicly; all others require SUPER_ADMIN role (see SecurityConfig)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

logging:
  level:
    com.webris.ris: DEBUG
    org.springframework.security: INFO
