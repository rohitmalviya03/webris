version: '3.8'

services:
  mysql:
    image: mysql:5.6
    container_name: ris-mysql
    environment:
      MYSQL_DATABASE: risdb
      MYSQL_USER: risuser
      MYSQL_PASSWORD: rispassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ris-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "risuser", "-prispassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  orthanc:
    image: orthancteam/orthanc:latest
    container_name: ris-orthanc
    ports:
      - "4242:4242"
      - "8042:8042"
    volumes:
      - ./docker/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc_data:/var/lib/orthanc/db
    networks:
      - ris-network
    environment:
      ORTHANC__NAME: "RIS Orthanc PACS"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      OHIF__SHOW_STUDY_LIST: "false"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ris-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/risdb?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: risuser
      SPRING_DATASOURCE_PASSWORD: rispassword
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USERNAME: admin
      ORTHANC_PASSWORD: admin
      JWT_SECRET: risSecretKey2024ThisIsAVeryLongSecretKeyForJWTTokenGeneration
      JWT_EXPIRATION: 86400000
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy
      orthanc:
        condition: service_started
    networks:
      - ris-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ris-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ris-network

  nginx:
    image: nginx:alpine
    container_name: ris-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - orthanc
    networks:
      - ris-network

volumes:
  mysql_data:
  orthanc_data:

networks:
  ris-network:
    driver: bridge
